<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CD List</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;
        }

        .container {
            width: 760px;
            margin: 35px auto;
        }

        h2 {
            color: #008c95;
            font-size: 22px;
            margin: 0 0 10px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            border: 1px solid #333;
            height: 28px;
            padding: 5px 7px;
            text-align: left;
            font-weight: bold;
        }

        td {
            border: 1px solid #333;
            height: 29px;
            padding: 5px 7px;
        }

        th.description {
            width: 60%;
        }

        th.price {
            width: 12%;
            text-align: center;
        }

        th.action {
            width: 28%;
        }

        td.price {
            text-align: right;
            padding-right: 10px;
        }

        td.action {
            text-align: center;
        }

        .product-link {
            color: #004a80;
            text-decoration: none;
        }

        .product-link:hover {
            text-decoration: underline;
        }

        .add-button {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            padding: 3px 9px;
            height: 24px;
            cursor: pointer;
            border: 1px solid #999;
            border-radius: 2px;
            background: linear-gradient(#ffffff, #dddddd);
            color: #111;
        }

        .add-button:hover {
            background: linear-gradient(#eeeeee, #cccccc);
        }
    </style>
</head>

<body>

<div class="container">

    <h2>CD list</h2>

    <table>

        <!-- HEADER -->
        <tr>
            <th class="description">Description</th>
            <th class="price">Price</th>
            <th class="action"></th>
        </tr>


        <!-- PRODUCT 1 -->
        <tr>
            <td>
                <span>86 (the band) - True Life Songs and Pictures</span>
            </td>

            <td class="price">
                $14.95
            </td>

            <td class="action">

                <form action="cart" method="post">

                    <input type="hidden"
                           name="action"
                           value="add">

                    <input type="hidden"
                           name="productCode"
                           value="CD001">

                    <input type="submit"
                           value="Add To Cart"
                           class="add-button">

                </form>

            </td>
        </tr>


        <!-- PRODUCT 2 -->
        <tr>
            <td>
                <span>Paddlefoot - The first CD</span>
            </td>

            <td class="price">
                $12.95
            </td>

            <td class="action">

                <form action="cart" method="post">

                    <input type="hidden"
                           name="action"
                           value="add">

                    <input type="hidden"
                           name="productCode"
                           value="CD002">

                    <input type="submit"
                           value="Add To Cart"
                           class="add-button">

                </form>

            </td>
        </tr>

 
        <!-- PRODUCT 3 -->
        <tr>
            <td>
                <span>Paddlefoot - The second CD</span>
            </td>

            <td class="price">
                $14.95
            </td>

            <td class="action">

                <form action="cart" method="post">

                    <input type="hidden"
                           name="action"
                           value="add">

                    <input type="hidden"
                           name="productCode"
                           value="CD003">

                    <input type="submit"
                           value="Add To Cart"
                           class="add-button">

                </form>

            </td>
        </tr>


        <!-- PRODUCT 4 -->
        <tr>
            <td>
                <span>Joe Rut - Genuine Wood Grained Finish</span>
            </td>

            <td class="price">
                $14.95
            </td>

            <td class="action">

                <form action="cart" method="post">

                    <input type="hidden"
                           name="action"
                           value="add">

                    <input type="hidden"
                           name="productCode"
                           value="CD004">

                    <input type="submit"
                           value="Add To Cart"
                           class="add-button">

                </form>

            </td>
        </tr>

    </table>

</div>

</body>
</html>
